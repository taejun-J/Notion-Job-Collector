name: Collect jobs to Notion

on:
  workflow_dispatch:
    inputs:
      max_jobs:
        description: Maximum number of matching jobs
        required: false
        default: "300"
        type: string
  schedule:
    - cron: "17 22 * * *" # 07:17 Asia/Seoul

permissions:
  contents: read

concurrency:
  group: notion-job-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Collect
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_JOB_DATA_SOURCE_ID: fe880847-c020-4c66-b8d4-840cfa4bbb6a
          NOTION_COMPANIES_DATA_SOURCE_ID: 95eedd44-631c-4f96-a18e-08f470709d96
          NOTION_API_VERSION: "2026-03-11"
          JASOSEOL_KEYWORDS: ${{ vars.JASOSEOL_KEYWORDS }}
          MAX_JOBS: ${{ inputs.max_jobs || '300' }}
        run: collect-jobs --source jasoseol --max-jobs "$MAX_JOBS"
